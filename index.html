  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, Arial, sans-serif;
      max-width: 800px;
      margin: 0 auto;
      padding: 15px;
      font-size: 17px;
      line-height: 1.5;
    }

    h1 {
      font-size: 22px;
      text-align: center;
      margin-bottom: 5px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      font-size: 14px;
      margin-bottom: 20px;
    }

    .patient-fields {
      background: #eef4fb;
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 20px;
      border: 1px solid #c9ddf0;
    }

    .patient-fields label {
      display: block;
      font-weight: bold;
      margin-bottom: 5px;
      background: none;
      padding: 0;
      cursor: default;
    }

    .patient-fields input {
      width: 100%;
      padding: 10px;
      font-size: 16px;
      border: 1px solid #bbb;
      border-radius: 6px;
      margin-bottom: 12px;
    }

    .patient-fields input:last-child {
      margin-bottom: 0;
    }

    .block-title {
      font-size: 18px;
      font-weight: bold;
      margin: 25px 0 10px;
      padding: 10px 15px;
      background: #2c3e50;
      color: white;
      border-radius: 8px;
    }

    .question {
      margin-bottom: 18px;
      padding: 15px;
      border: 1px solid #ddd;
      border-radius: 10px;
      background: #fafafa;
    }

    .question h3 {
      margin-top: 0;
      font-size: 17px;
    }

    label.answer {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 10px 0;
      padding: 10px;
      background: white;
      border-radius: 6px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    label.answer:active {
      background: #eee;
    }

    input[type="checkbox"] {
      width: 22px;
      height: 22px;
      flex-shrink: 0;
    }

    button {
      width: 100%;
      padding: 15px;
      font-size: 18px;
      cursor: pointer;
      background: #4CAF50;
      color: white;
      border: none;
      border-radius: 10px;
      margin-top: 10px;
    }

    button:active {
      background: #45a049;
    }

    button.secondary {
      background: #888;
      margin-top: 8px;
    }

    button.gen-btn {
      background: #1a3a6c;
      margin-top: 15px;
    }

    button.copy-btn {
      background: #5865F2;
      margin-top: 15px;
    }

    button.img-btn {
      background: #e67e22;
      margin-top: 8px;
    }

    #result {
      margin-top: 20px;
      padding: 20px;
      border-radius: 10px;
      transition: background 0.4s, color 0.4s, transform 0.2s;
      text-align: center;
    }

    #result.flash {
      transform: scale(1.03);
    }

    #result .score {
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    #result .label {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    #result .recommendation {
      font-size: 15px;
      font-weight: normal;
      line-height: 1.4;
      padding-top: 10px;
      border-top: 1px solid rgba(0, 0, 0, 0.15);
    }

    #certificate {
      position: relative;
      /* печать позиционируется внутри справки */
      cursor: crosshair;
      /* подсказка, что можно кликнуть */
      margin-top: 20px;
      padding: 20px;
      border-radius: 10px;
      background: #f5f5f5;
      border: 2px dashed #999;
      font-family: 'Courier New', monospace;
      font-size: 15px;
      white-space: pre-wrap;
      line-height: 1.5;
      overflow: hidden;
      /* печать не вылезает за пределы */
    }

    #certificate .cert-header {
      text-align: center;
      font-weight: bold;
      font-size: 17px;
      margin-bottom: 15px;
      border-bottom: 1px solid #999;
      padding-bottom: 10px;
    }

    #certificate .cert-body {
      white-space: pre-wrap;
    }

    #certificate .cert-sign {
      margin-top: 15px;
      padding-top: 10px;
      border-top: 1px solid #999;
    }

    .copy-status {
      text-align: center;
      color: #4CAF50;
      font-weight: bold;
      margin-top: 10px;
      font-size: 15px;
      min-height: 20px;
    }

    /* ===== ПЕЧАТЬ ===== */
    .stamp-img {
      position: absolute;
      width: 200px;
      height: 200px;
      pointer-events: none;
      transform: translate(-50%, -50%);
      opacity: 0.85;
      mix-blend-mode: multiply;
      z-index: 10;
    }

    /* Оверлей поверх всей справки в скрытом блоке для скриншота */
    #ciStampArea {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 10;
    }

    #ciStampArea .stamp-img {
      opacity: 0.9;
    }

    /* ===== СКРЫТЫЙ БЛОК ДЛЯ ГЕНЕРАЦИИ КАРТИНКИ ===== */
    #certImage {
      position: fixed;
      left: -9999px;
      top: 0;
      width: 700px;
      background: #ffffff;
      padding: 40px 50px;
      font-family: 'Georgia', 'Times New Roman', serif;
      color: #1a1a1a;
      overflow: hidden;
    }

    #certImage .ci-header {
      position: relative;
      border-bottom: 3px double #1a3a6c;
      padding-bottom: 20px;
      margin-bottom: 25px;
      min-height: 110px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #certImage .ci-logo {
      position: absolute;
      left: 0;
      top: 50%;
      transform: translateY(-50%);
      width: 100px;
      height: 100px;
    }

    #certImage .ci-header-text {
      text-align: center;
    }

    #certImage .ci-org {
      font-size: 13px;
      letter-spacing: 3px;
      color: #1a3a6c;
      font-weight: bold;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    #certImage .ci-title {
      font-size: 26px;
      font-weight: bold;
      color: #1a3a6c;
      letter-spacing: 2px;
      margin-bottom: 4px;
    }

    #certImage .ci-subtitle {
      font-size: 13px;
      color: #666;
      font-style: italic;
    }

    #certImage .ci-body {
      font-size: 17px;
      line-height: 1.8;
      margin-bottom: 30px;
    }

    #certImage .ci-row {
      margin-bottom: 12px;
    }

    #certImage .ci-label {
      color: #555;
      font-size: 14px;
    }

    #certImage .ci-value {
      font-weight: bold;
      color: #1a1a1a;
    }

    #certImage .ci-state {
      font-size: 20px;
      font-weight: bold;
      padding: 4px 0;
      display: inline-block;
      margin: 6px 0;
    }

    #certImage .ci-verdict {
      font-size: 18px;
      font-style: italic;
      margin-top: 12px;
      padding: 12px 20px;
      border-left: 4px solid #1a3a6c;
      background: #f0f4fa;
    }

    #certImage .ci-footer {
      margin-top: 40px;
      padding-top: 20px;
      border-top: 1px solid #ccc;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      font-size: 14px;
    }

    #certImage .ci-sign-line {
      border-bottom: 1px solid #1a1a1a;
      min-width: 200px;
      padding-bottom: 3px;
      margin-bottom: 5px;
      font-family: 'Georgia', serif;
      font-style: italic;
      font-size: 16px;
    }

    #certImage .ci-date {
      color: #555;
      font-size: 13px;
      text-align: right;
    }
  </style>
</head>

<body>

  <h1>Чек-лист психического здоровья</h1>
  <div class="subtitle">Emergency Medical Service</div>

  <div class="patient-fields">
    <label for="patientName">Имя и фамилия пациента:</label>

    <label for="doctorName">Имя и фамилия врача:</label>

      <div class="cert-body" id="certBody"></div>
      <div class="cert-sign" id="certSign"></div>

    <div class="copy-status" id="copyStatus"></div>
  </div>

    // На десктопе — клик по справке ставит печать
    if (!isMobile && certEl) {
      certEl.addEventListener('click', (e) => {
        const rect = certEl.getBoundingClientRect();
        const xPercent = (e.clientX - rect.left) / rect.width;
        const yPercent = (e.clientY - rect.top) / rect.height;
        setStamp(xPercent, yPercent);
      });
    }

    function setStamp(xPercent, yPercent) {
      stampPos = { xPercent, yPercent };

      // 1) Видимая справка — печать прямо внутри #certificate
      if (certEl) {
        let img = certEl.querySelector(':scope > .stamp-img');
        if (!img) {
          img = document.createElement('img');
          img.className = 'stamp-img';
          img.src = STAMP_SRC;
          img.alt = 'Печать';
          certEl.appendChild(img);
        }
        img.style.left = (xPercent * 100) + '%';
        img.style.top = (yPercent * 100) + '%';
      }

      // 2) Скрытый блок для картинки
      renderStampInImage();
    }

    function renderStampInImage() {
      if (isMobile) return;
      const ciArea = document.getElementById('ciStampArea');
      if (!ciArea) return;

      ciArea.innerHTML = '';
      if (!stampPos) return;

      const img = document.createElement('img');
      img.className = 'stamp-img';
      img.src = STAMP_SRC;
      img.alt = 'Печать';
      img.style.left = (stampPos.xPercent * 100) + '%';
      img.style.top = (stampPos.yPercent * 100) + '%';
      ciArea.appendChild(img);
    }

    function capitalizeName(str) {
      return str.trim().toLowerCase().split(/\s+/)
        .map(word => word.split('-')
          .map(part => part.charAt(0).toUpperCase() + part.slice(1)).join('-'))
        .join(' ');

      resultEl.style.opacity = '1';

      const patient = capitalizeName(patientInput.value);
      const doctor = capitalizeName(doctorInput.value);

      if (!patient || !doctor) {
        alert('Пожалуйста, заполните имя пациента и имя врача перед проверкой.');
        return;
      }

      patientInput.value = patient;
      doctorInput.value = doctor;
      localStorage.setItem('doctorName', doctor);

      let mainScore = 0;
      let situationScore = 0;

      questions.forEach((q, qi) => {
        const checked = [...document.querySelectorAll(`input[name="q${qi}"]:checked`)]
          .map(cb => parseInt(cb.value)).sort((a, b) => a - b);
        const correct = [...q.correct].sort((a, b) => a - b);
        const isRight = checked.length === correct.length &&
          checked.every((v, i) => v === correct[i]);
        if (isRight) {
          if (qi < SITUATIONS_START) mainScore += 1;
          else situationScore += 1;
        }
      });

      const total = Math.min(mainScore + situationScore, MAX_SCORE);
      const maxTotal = MAX_SCORE;
      const rule = colorRules.find(r => total >= r.from && total <= r.to)
        || colorRules[colorRules.length - 1];

      resultEl.innerHTML = `
    <div class="score">${rule.emoji} Результат: ${total} из ${maxTotal}</div>
    <div class="label">${rule.label}</div>
    <div class="recommendation">${rule.recommendation}</div>
  `;
      resultEl.style.background = rule.bg;
      resultEl.style.color = rule.color;

      resultEl.classList.remove('flash');
      void resultEl.offsetWidth;
      resultEl.classList.add('flash');
      setTimeout(() => resultEl.classList.remove('flash'), 200);

      const today = new Date().toLocaleDateString('ru-RU', {
        day: '2-digit', month: '2-digit', year: 'numeric'
      });

      certBodyEl.textContent =
        `Справка на имя: ${patient}.\n` +
        `Психическое состояние: ${rule.certState}.\n` +
        `${rule.certVerdict}\n` +
        `Дата осмотра: ${today}.`;

      certSignEl.textContent = `Подпись врача: ${doctor}`;

      if (!isMobile) {
        const ciPatient = document.getElementById('ciPatient');
        const ciDoctor = document.getElementById('ciDoctor');
        const ciDate = document.getElementById('ciDate');
        const ciState = document.getElementById('ciState');
        const ciVerdict = document.getElementById('ciVerdict');

        if (ciPatient) ciPatient.textContent = patient;
        if (ciDoctor) ciDoctor.textContent = doctor;
        if (ciDate) ciDate.textContent = `Дата осмотра: ${today}`;
        if (ciState) {
          ciState.textContent = rule.certState;
          ciState.style.color = rule.imgStateColor;
        }
        if (ciVerdict) ciVerdict.textContent = rule.certVerdict;

        renderStampInImage();
      }

      document.getElementById('certWrapper').style.display = 'none';
      document.getElementById('genBtn').style.display = 'block';
      copyStatus.textContent = '';
    }

    function generateCertificate() {
      document.getElementById('certWrapper').style.display = 'block';
      document.getElementById('genBtn').style.display = 'none';

      if (isMobile) {
        const imgBtn = document.getElementById('imgBtn');
        if (imgBtn) imgBtn.style.display = 'none';
      }

      setTimeout(() => {
        document.getElementById('certificate').scrollIntoView({
          behavior: 'smooth', block: 'start'
        });
      }, 50);
    }

    function copyCertificate() {
      const fullText =
        `📄 СПРАВКА О ПСИХИЧЕСКОМ СОСТОЯНИИ\n` +
        `Emergency Medical Service\n` +
        `─────────────────────\n` +
        certBodyEl.textContent + `\n` +
        `─────────────────────\n` +
        certSignEl.textContent;

      navigator.clipboard.writeText(fullText)
        .then(() => {
          copyStatus.textContent = '✅ Скопировано! Вставь в Discord.';
          setTimeout(() => copyStatus.textContent = '', 3000);
        })
        .catch(() => {
          const ta = document.createElement('textarea');
          ta.value = fullText;
          document.body.appendChild(ta);
          ta.select();
          document.execCommand('copy');
          document.body.removeChild(ta);
          copyStatus.textContent = '✅ Скопировано! Вставь в Discord.';
          setTimeout(() => copyStatus.textContent = '', 3000);
        });
    }

    function copyCertificateAsImage() {
      if (isMobile) return;

      if (typeof html2canvas === 'undefined') {
        copyStatus.textContent = '⏳ Загружаем модуль для картинки...';
        const script = document.createElement('script');
        script.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
        script.onload = () => {
          copyStatus.textContent = '';
          copyCertificateAsImage();
        };
        script.onerror = () => {
          copyStatus.textContent = '';
          alert('Не удалось загрузить модуль. Проверь соединение с интернетом.');
        };
        document.head.appendChild(script);
        return;
      }

      const certImg = document.getElementById('certImage');
      if (!certImg) return;

      html2canvas(certImg, {
        backgroundColor: '#ffffff',
        scale: 2,
        useCORS: true,
        allowTaint: true,
        logging: false
      }).then(canvas => {
        canvas.toBlob(blob => {
          if (navigator.clipboard && window.ClipboardItem) {
            navigator.clipboard.write([
              new ClipboardItem({ 'image/png': blob })
            ]).then(() => {
              copyStatus.textContent = '✅ Картинка скопирована! Вставь в Discord (Ctrl+V).';
              setTimeout(() => copyStatus.textContent = '', 4000);
            }).catch(() => downloadCanvas(canvas));
          } else {
            downloadCanvas(canvas);
          }
        }, 'image/png');
      }).catch(err => {
        alert('Не удалось создать картинку: ' + err.message);
      });
    }

    function downloadCanvas(canvas) {
      const link = document.createElement('a');
      link.download = 'справка_психическое_состояние.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
      copyStatus.textContent = '💾 Картинка скачана файлом (буфер недоступен).';
      setTimeout(() => copyStatus.textContent = '', 4000);
    }

    function resetQuiz() {
      document.querySelectorAll('input[type=checkbox]').forEach(cb => cb.checked = false);
      resultEl.innerHTML = '';
      resultEl.style.background = '';
      resultEl.style.color = '';
      resultEl.style.opacity = '1';

      document.getElementById('certWrapper').style.display = 'none';
      document.getElementById('genBtn').style.display = 'none';
      copyStatus.textContent = '';

      // Сброс печати
      stampPos = null;
      if (certEl) {
        const img = certEl.querySelector(':scope > .stamp-img');
        if (img) img.remove();
      }
      const cia = document.getElementById('ciStampArea');
      if (cia) cia.innerHTML = '';

      // Сброс имени пациента
      patientInput.value = '';

      // Прокрутка наверх
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    form.addEventListener('change', () => {
      if (resultEl.innerHTML) resultEl.style.opacity = '0.5';
    });
  </script>

</body>
