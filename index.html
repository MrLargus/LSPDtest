<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Чек-лист психического здоровья — ПОЛИЦИЯ</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, Arial, sans-serif;
    max-width: 800px; margin: 0 auto; padding: 15px;
    font-size: 17px; line-height: 1.5;
  }
  h1 { font-size: 22px; text-align: center; margin-bottom: 5px; }
  .subtitle { text-align: center; color: #666; font-size: 14px; margin-bottom: 20px; }
  .block-title {
    font-size: 18px; font-weight: bold; margin: 25px 0 10px;
    padding: 10px 15px; background: #2c3e50; color: white;
    border-radius: 8px;
  }
  .question {
    margin-bottom: 18px; padding: 15px;
    border: 1px solid #ddd; border-radius: 10px; background: #fafafa;
  }
  .question h3 { margin-top: 0; font-size: 17px; }
  label {
    display: flex; align-items: center; gap: 10px;
    margin: 10px 0; padding: 10px; background: white;
    border-radius: 6px; cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  label:active { background: #eee; }
  input[type="checkbox"] { width: 22px; height: 22px; flex-shrink: 0; }
  button {
    width: 100%; padding: 15px; font-size: 18px; cursor: pointer;
    background: #4CAF50; color: white; border: none;
    border-radius: 10px; margin-top: 10px;
  }
  button:active { background: #45a049; }
  #result {
    margin-top: 20px; padding: 20px; border-radius: 10px;
    transition: background 0.4s, color 0.4s, transform 0.2s;
    text-align: center;
  }
  #result.flash { transform: scale(1.03); }
  #result .score {
    font-size: 22px; font-weight: bold; margin-bottom: 10px;
  }
  #result .label {
    font-size: 20px; font-weight: bold; margin-bottom: 8px;
  }
  #result .recommendation {
    font-size: 15px; font-weight: normal; line-height: 1.4;
    padding-top: 10px; border-top: 1px solid rgba(0,0,0,0.15);
  }
</style>
</head>
<body>

<h1>Чек-лист психического здоровья</h1>
<div class="subtitle">Фракция ПОЛИЦИЯ</div>

<form id="quiz"></form>
<button onclick="checkAnswers()">Проверить</button>
<button onclick="resetQuiz()" style="background:#888;margin-top:8px;">Сбросить</button>
<div id="result"></div>

<script>
const questions = [
  // ===== БЛОК 1: Ориентация и дисциплина =====
  { block: "📋 БЛОК 1: Ориентация и дисциплина",
    text: "Назови своё имя, звание, номер жетона и текущий патрульный район.",
    answers: ["Путается в данных, не помнит свой отдел",
              "Чётко называет данные, не путается, знает свой отдел"],
    correct: [1] },
  { block: "📋 БЛОК 1: Ориентация и дисциплина",
    text: "Сколько ты на службе и кто твой непосредственный начальник?",
    answers: ["Не помнит стаж и командира",
              "Называет стаж, знает командира по цепочке"],
    correct: [1] },
  { block: "📋 БЛОК 1: Ориентация и дисциплина",
    text: "Что делать при сигнале «офицер нуждается в помощи»?",
    answers: ["Игнорировать — не моя зона ответственности",
              "Немедленно выдвигается, докладывает по рации"],
    correct: [1] },

  // ===== БЛОК 2: Контроль стресса и эмоций =====
  { block: "📋 БЛОК 2: Контроль стресса и эмоций",
    text: "Как ты чувствуешь себя после тяжёлой смены?",
    answers: ["Агрессия или апатия, нет способов разрядки",
              "Усталость признаёт, но без агрессии/апатии. Есть способы разрядки"],
    correct: [1] },
  { block: "📋 БЛОК 2: Контроль стресса и эмоций",
    text: "Ты только что застрелил подозреваемого. Что чувствуешь?",
    answers: ["«Норм, он сам виноват, пофиг»",
              "Серьёзность, сожаление, готовность к разбору ситуации"],
    correct: [1] },
  { block: "📋 БЛОК 2: Контроль стресса и эмоций",
    text: "Коллега погиб на задании. Твои действия?",
    answers: ["Месть вне закона, самосуд",
              "Доклад, помощь в расследовании. Без мести вне закона"],
    correct: [1] },

  // ===== БЛОК 3: Применение силы и оружия =====
  { block: "📋 БЛОК 3: Применение силы и оружия",
    text: "Когда можно применить огнестрельное оружие?",
    answers: ["Для запугивания или по желанию",
              "Только при прямой угрозе жизни (себе/гражданам/коллегам)"],
    correct: [1] },
  { block: "📋 БЛОК 3: Применение силы и оружия",
    text: "Подозреваемый убегает без оружия. Твои действия?",
    answers: ["Стрелять на поражение",
              "Погоня, задержание, тазер. НЕ стрелять на поражение"],
    correct: [1] },
  { block: "📋 БЛОК 3: Применение силы и оружия",
    text: "Гражданин оскорбляет тебя. Реакция?",
    answers: ["Применить силу за слова",
              "Сохраняет спокойствие, действует по протоколу"],
    correct: [1] },
  { block: "📋 БЛОК 3: Применение силы и оружия",
    text: "Тебя спровоцировали на OOC-агрессию. Что делаешь?",
    answers: ["Отвечает токсичностью, эскалирует конфликт",
              "Игнорирует, докладывает админам, не отвечает токсичностью"],
    correct: [1] },

  // ===== БЛОК 4: Власть и коррупция =====
  { block: "📋 БЛОК 4: Власть и коррупция (психологическая проверка)",
    text: "Тебе предлагают взятку $50.000 за отпуск задержанного. Ответ?",
    answers: ["Взять деньги, отпустить",
              "Отказ, доклад руководству, задержание за дачу взятки"],
    correct: [1] },
  { block: "📋 БЛОК 4: Власть и коррупция (психологическая проверка)",
    text: "Начальник приказывает нарушить закон. Твои действия?",
    answers: ["«Приказ есть приказ» — выполнить",
              "Отказ, доклад старшему составу"],
    correct: [1] },
  { block: "📋 БЛОК 4: Власть и коррупция (психологическая проверка)",
    text: "Друг нарушил закон. Ты его видишь. Что делаешь?",
    answers: ["Покрывает друга",
              "Действует по закону одинаково для всех. Не покрывает"],
    correct: [1] },
  { block: "📋 БЛОК 4: Власть и коррупция (психологическая проверка)",
    text: "Чувствуешь ли ты себя «выше» гражданских?",
    answers: ["«Я коп, мне можно всё»",
              "«Нет, я на службе у граждан»"],
    correct: [1] },

  // ===== БЛОК 5: Восприятие реальности (IC/OOC) =====
  { block: "📋 БЛОК 5: Восприятие реальности (IC/OOC)",
    text: "Понимаешь, что это игра и роль?",
    answers: ["Нет, путаю игру и реальность",
              "Да, чётко разделяет"],
    correct: [1] },
  { block: "📋 БЛОК 5: Восприятие реальности (IC/OOC)",
    text: "Бывало, что ты «застревал» в роли копа вне игры?",
    answers: ["Да, постоянно",
              "Нет или редко, осознаю"],
    correct: [1] },
  { block: "📋 БЛОК 5: Восприятие реальности (IC/OOC)",
    text: "Используешь ли служебное положение вне RP?",
    answers: ["Да, использую",
              "Нет. Метагейм запрещён"],
    correct: [1] },

  // ===== БЛОК 6: Психологическая устойчивость =====
  { block: "📋 БЛОК 6: Психологическая устойчивость",
    text: "Как справляешься с давлением руководства?",
    answers: ["Агрессия, конфликт, саботаж",
              "Конструктивно, через диалог/рапорт"],
    correct: [1] },
  { block: "📋 БЛОК 6: Психологическая устойчивость",
    text: "Бывают ли мысли «все вокруг враги»?",
    answers: ["Да, постоянно",
              "Нет. Паранойя — красный флаг для копа"],
    correct: [1] },
  { block: "📋 БЛОК 6: Психологическая устойчивость",
    text: "Обращаешься ли за помощью (старший состав департамента, друзья)?",
    answers: ["Нет, считаю это стыдным",
              "Да, считает это нормальным, не стыдится"],
    correct: [1] },

  // ===== ДОПОЛНИТЕЛЬНЫЙ ТЕСТ: СИТУАЦИИ =====
  { block: "🎯 ДОПОЛНИТЕЛЬНЫЙ ТЕСТ: СИТУАЦИИ",
    text: "A. Ты один, подозреваемый вооружён, заложник в машине. Действия?",
    answers: ["Героически штурмовать в одиночку",
              "Запросить подкрепление, негероически не штурмовать, вести переговоры"],
    correct: [1] },
  { block: "🎯 ДОПОЛНИТЕЛЬНЫЙ ТЕСТ: СИТУАЦИИ",
    text: "B. Коллега пьёт на службе. Что делаешь?",
    answers: ["Покрывать коллегу",
              "Доклад руководству, забота о безопасности. НЕ покрывать"],
    correct: [1] },
  { block: "🎯 ДОПОЛНИТЕЛЬНЫЙ ТЕСТ: СИТУАЦИИ",
    text: "C. Тебя уволили несправедливо. Реакция?",
    answers: ["Мстить департаменту",
              "Разъяснение ситуации, предоставить доказательства своей невиновности"],
    correct: [1] }
];

// =====================================================
// НАСТРОЙКА ЦВЕТОВ И РЕКОМЕНДАЦИЙ
// =====================================================
const MAIN_QUESTIONS_COUNT = 20;

const colorRules = [
  {
    from: 0, to: 8,
    bg: '#f8d7da', color: '#721c24', emoji: '🔴',
    label: 'Отстранение от службы',
    recommendation: 'Разбор со старшим составом департамента. Требуется повторная беседа и пересдача чек-листа.'
  },
  {
    from: 9, to: 13,
    bg: '#ffe5b4', color: '#8a5a00', emoji: '🟠',
    label: 'Только патруль под наблюдением',
    recommendation: 'Беседа с командиром подразделения. Ограничение самостоятельных действий до повторной проверки.'
  },
  {
    from: 14, to: 17,
    bg: '#fff3cd', color: '#856404', emoji: '⚠️',
    label: 'Допуск с наставником',
    recommendation: 'Повторная проверка через 2 дня. Работа в паре с опытным офицером.'
  },
  {
    from: 18, to: 999,
    bg: '#d4edda', color: '#155724', emoji: '✅',
    label: 'Полный допуск к службе',
    recommendation: 'Психологический профиль в норме. Офицер готов к самостоятельной службе.'
  }
];
// =====================================================

const form = document.getElementById('quiz');
const resultEl = document.getElementById('result');

// Рендер вопросов с заголовками блоков
let currentBlock = null;
questions.forEach((q, qi) => {
  if (q.block && q.block !== currentBlock) {
    currentBlock = q.block;
    const blockTitle = document.createElement('div');
    blockTitle.className = 'block-title';
    blockTitle.textContent = q.block;
    form.appendChild(blockTitle);
  }

  const div = document.createElement('div');
  div.className = 'question';
  let html = `<h3>${qi + 1}. ${q.text}</h3>`;
  q.answers.forEach((a, ai) => {
    html += `<label><input type="checkbox" name="q${qi}" value="${ai}"> <span>${a}</span></label>`;
  });
  div.innerHTML = html;
  form.appendChild(div);
});

function checkAnswers() {
  resultEl.style.opacity = '1';

  let total = 0;
  const maxTotal = MAIN_QUESTIONS_COUNT;

  questions.forEach((q, qi) => {
    const checked = [...document.querySelectorAll(`input[name="q${qi}"]:checked`)]
                      .map(cb => parseInt(cb.value)).sort((a,b)=>a-b);
    const correct = [...q.correct].sort((a,b)=>a-b);
    const isRight = checked.length === correct.length &&
                    checked.every((v, i) => v === correct[i]);
    if (isRight && qi < MAIN_QUESTIONS_COUNT) total += 1;
  });

  const rule = colorRules.find(r => total >= r.from && total <= r.to)
               || colorRules[colorRules.length - 1];

  resultEl.innerHTML = `
    <div class="score">${rule.emoji} Результат: ${total} из ${maxTotal}</div>
    <div class="label">${rule.label}</div>
    <div class="recommendation">${rule.recommendation}</div>
  `;
  resultEl.style.background = rule.bg;
  resultEl.style.color = rule.color;

  resultEl.classList.remove('flash');
  void resultEl.offsetWidth;
  resultEl.classList.add('flash');
  setTimeout(() => resultEl.classList.remove('flash'), 200);
}

function resetQuiz() {
  document.querySelectorAll('input[type=checkbox]').forEach(cb => cb.checked = false);
  resultEl.innerHTML = '';
  resultEl.style.background = '';
  resultEl.style.color = '';
  resultEl.style.opacity = '1';
}

form.addEventListener('change', () => {
  if (resultEl.innerHTML) {
    resultEl.style.opacity = '0.5';
  }
});
</script>

</body>
</html>
