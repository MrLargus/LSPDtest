<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Психология</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, Arial, sans-serif;
    max-width: 800px; margin: 0 auto; padding: 15px;
    font-size: 17px; line-height: 1.5;
  }
  h1 { font-size: 22px; text-align: center; }
  .question {
    margin-bottom: 18px; padding: 15px;
    border: 1px solid #ddd; border-radius: 10px; background: #fafafa;
  }
  .question h3 { margin-top: 0; font-size: 17px; }
  label {
    display: flex; align-items: center; gap: 10px;
    margin: 10px 0; padding: 10px; background: white;
    border-radius: 6px; cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  label:active { background: #eee; }
  input[type="checkbox"] { width: 22px; height: 22px; flex-shrink: 0; }
  button {
    width: 100%; padding: 15px; font-size: 18px; cursor: pointer;
    background: #4CAF50; color: white; border: none;
    border-radius: 10px; margin-top: 10px;
  }
  button:active { background: #45a049; }
  #result {
    margin-top: 20px; font-size: 22px; font-weight: bold;
    text-align: center; padding: 20px; border-radius: 10px;
    transition: background 0.4s, color 0.4s, transform 0.2s;
    min-height: 30px;
  }
  #result.flash {
    transform: scale(1.05);
  }
</style>
</head>
<body>

<h1>Опросник</h1>
<form id="quiz"></form>
<button onclick="checkAnswers()">Проверить</button>
<button onclick="resetQuiz()" style="background:#888;margin-top:8px;">Сбросить</button>
<div id="result"></div>

<script>
const questions = [
  {
    text: "Из какого вы подразделения?",
    answers: ["Отвечает чётко и быстро", "Иные варианты"],
    correct: [1],
    points: 1
  },
  {
    text: "Кто ваш начальник?",
    answers: ["Отвечает без запинки", "Иные варианты"],
    correct: [1],
    points: 1
  },
  {
    text: "Ваша должность?",
    answers: ["Отвечает чётко и быстро", "Иные варианты"],
    correct: [1],
    points: 1
  },
 {
    text: "Как ваше настроение?",
    answers: ["Хорошее", "Плохое"],
    correct: [1],
    points: 1
  }
];

const form = document.getElementById('quiz');
const resultEl = document.getElementById('result');

// Рендер вопросов
questions.forEach((q, qi) => {
  const div = document.createElement('div');
  div.className = 'question';
  let html = `<h3>${qi + 1}. ${q.text} <small>(${q.points} балл.)</small></h3>`;
  q.answers.forEach((a, ai) => {
    html += `<label><input type="checkbox" name="q${qi}" value="${ai}"> <span>${a}</span></label>`;
  });
  div.innerHTML = html;
  form.appendChild(div);
});

// Функция подсчёта и обновления результата
function checkAnswers() {
  resultEl.style.opacity = '1';   // возвращаем непрозрачность

  let total = 0, maxTotal = 0;

  questions.forEach((q, qi) => {
    maxTotal += q.points;
    const checked = [...document.querySelectorAll(`input[name="q${qi}"]:checked`)]
                      .map(cb => parseInt(cb.value)).sort((a,b)=>a-b);
    const correct = [...q.correct].sort((a,b)=>a-b);
    const isRight = checked.length === correct.length &&
                    checked.every((v, i) => v === correct[i]);
    if (isRight) total += q.points;
  });

  const missed = maxTotal - total;
  const half = maxTotal / 2;
  let bg, color, emoji;

  if (missed <= 1) {
    bg = '#d4edda'; color = '#155724'; emoji = '🟢';
  } else if (total >= half - 1 && total > 1) {
    bg = '#fff3cd'; color = '#856404'; emoji = '🟡';
  } else {
    bg = '#f8d7da'; color = '#721c24'; emoji = '🔴';
  }

  resultEl.innerHTML = `${emoji} Результат: ${total} из ${maxTotal} баллов`;
  resultEl.style.background = bg;
  resultEl.style.color = color;

  resultEl.classList.remove('flash');
  void resultEl.offsetWidth;
  resultEl.classList.add('flash');
  setTimeout(() => resultEl.classList.remove('flash'), 200);
}

function resetQuiz() {
  document.querySelectorAll('input[type=checkbox]').forEach(cb => cb.checked = false);
  resultEl.innerHTML = '';
  resultEl.style.background = '';
  resultEl.style.color = '';
  resultEl.style.opacity = '1';
}

// Если поменял ответы после проверки — старый результат бледнеет
form.addEventListener('change', () => {
  if (resultEl.innerHTML) {
    resultEl.style.opacity = '0.5';
  }
});

// При новом нажатии "Проверить" возвращаем непрозрачность
const originalCheck = checkAnswers;
checkAnswers = function() {
  resultEl.style.opacity = '1';
  originalCheck();
};
</script>

</body>
</html>
